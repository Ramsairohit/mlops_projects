[project]
name = "mlops-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ramsairohit", email = "gunururamsairohit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagshub>=0.7.3",
    "dvc[s3]>=3.67.1",
    "hyperopt>=0.3.0",
    "ipykernel>=7.3.0",
    "keras>=3.15.1",
    "mlflow>=3.16.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]
[project.scripts]
mlops = "mlops_project:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
